name: Flyway Migration Check

on:
  pull_request:
    paths:
      - "code/backend/backend-app/src/main/resources/db/migration/**"
      - ".github/workflows/flyway-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-empty-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yuanzuo_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yuanzuo_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check duplicate Flyway versions
        shell: bash
        run: |
          migration_dir="code/backend/backend-app/src/main/resources/db/migration"
          duplicates="$(
            find "$migration_dir" -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
              | sed -E 's/^V([0-9]+)__.*/\1/' \
              | sort \
              | uniq -d
          )"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate Flyway versions:"
            echo "$duplicates"
            exit 1
          fi

      - name: Install backend reactor
        working-directory: code/backend
        run: mvn -B -pl backend-app -am install -Dmaven.test.skip=true

      - name: Migrate empty PostgreSQL database
        working-directory: code/backend/backend-app
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/yuanzuo_ai_test
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
        run: >-
          mvn -B org.flywaydb:flyway-maven-plugin:11.7.2:migrate
          -Dflyway.locations=filesystem:src/main/resources/db/migration

      - name: Validate Flyway history
        working-directory: code/backend/backend-app
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/yuanzuo_ai_test
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
        run: >-
          mvn -B org.flywaydb:flyway-maven-plugin:11.7.2:validate
          -Dflyway.locations=filesystem:src/main/resources/db/migration
